apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  labels:
    app.kubernetes.io/name: status-api
    app.kubernetes.io/part-of: jenkins-gitops-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: status-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-api
        app.kubernetes.io/part-of: jenkins-gitops-pipeline
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status-api
          image: ghcr.io/placeholder/status-api:set-by-overlay
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: status-api-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          # Illustrative starting values, not measurements.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
