apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: status-api-staging

images:
  - name: ghcr.io/placeholder/status-api
    # Placeholder tag. scripts/promote.py replaces newTag. This is not a release.
    newTag: "0.1.0-staging"

replicas:
  - name: status-api
    count: 1

labels:
  - pairs:
      app.kubernetes.io/instance: status-api-staging
    includeSelectors: false

patches:
  - path: configmap.yaml
